# PR に、いま誰の番かを表す状態のラベル(状態:レビュー待ち・状態:レビュー対応中 など)を 1 つだけ付ける。決め方は .github/scripts/pr-status.sh
#
# 状態が変わりうるとき(PR の動き・CI の終わり)に、その PR を事実から出し直して付け替える。
# ai-auto-merge.yml も起動するきっかけ(CodeRabbit のレビューの終わり・CI の成功・ready にした・マージを止めるラベルが外れた)では、
# ai-auto-merge.yml のジョブが最後に状態のラベルを出し直すので、ここでは動かさない(同じきっかけで数秒のジョブを 2 つ課金しない。#534)。
# GITHUB_TOKEN で付けたラベルやマージはワークフローを起こさないので、AI のワークフロー(ai-review-loop.yml・ai-draft-sweep.yml)は、
# 状態を変えた後でこのワークフローを番号付きで呼ぶ(ai-auto-merge.yml も呼ぶときは、そちらに任せて呼ばない)。開いている PR のすべての出し直しは、見回り
# (ai-review-sweep.yml)が定期的に行うので、途中で止まったジョブが古いラベルを残しても、そこで直る。
# 1 回に PR 1 件あたり 10 回ほど API を呼ぶ。GITHUB_TOKEN の上限(1 時間に 1,000 回)をほかの AI のワークフローと分け合うので、
# すべての PR を出し直すのは見回りと手動のときだけにし、ほかのきっかけでは、その PR だけを出し直す。
# private のリポジトリでは、動いたジョブは数秒でも 1 分として課金され、if で飛ばしたジョブは課金されない。
# そのため、状態を変えないイベントは if で落とす
# PR のコードは checkout しない(pull_request_target で書き込みの権限を持つため)。スクリプトは既定のブランチのものを使う
name: PR の状態のラベル

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, closed, labeled, unlabeled]
  workflow_run:
    workflows: [test]   # CI のワークフロー名に合わせる
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: PR の番号(空なら開いている PR すべて)
        required: false

permissions: {}

# 同じ PR の回を 1 列に並べる。取り消しはしない: concurrency はジョブの if より前に効くので、取り消すと、if で飛ばされる起動
# (関係のないラベルの付け外しなど)が、AI のワークフローから呼ばれた回を止めてしまう。何度動かしても同じ結果になるので、待たせても害は無い。
# ai-auto-merge.yml に任せて必ず飛ばすきっかけ(CI の成功・ready にした・マージを止めるラベルが外れた)は、PR ごとのグループで待っている
# 回を押し出さないよう、実行ごとのグループに逃がす(docs/review-checklist.md の RC-03)
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_run' && contains(fromJSON('["success","skipped"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'pull_request_target' && (github.event.action == 'ready_for_review'
        || (github.event.action == 'unlabeled'
          && contains(fromJSON('["needs-human","needs-local","needs-manual","needs-decision","needs-approval","ai-in-actions"]'), github.event.label.name)))))
      && format('pr-status-run-{0}', github.run_id)
      || format('pr-status-{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.number || github.event_name) }}
  cancel-in-progress: false

jobs:
  label:
    # CodeRabbit のレビューの終わり・CI の成功・ready にした・マージを止めるラベル(待ちのラベルと ai-in-actions)が外れたときは、
    # ai-auto-merge.yml のジョブが最後に状態のラベルを出し直すので、ここでは動かさない(#534)。
    # ラベルの付け外しは、状態の決め方(pr-status.sh)が見る制御用のラベルと、状態のラベルのときだけ。
    # 人が状態のラベルを手で付け替えたときは動いて、事実どおりに戻す。
    # CI は PR に結び付いた回で、成功しなかったときだけ。このジョブが付け替えたラベルは GITHUB_TOKEN なので、ここへは戻ってこない。
    # draft の状態は、作業中か、待ちのラベル(needs-human・needs-decision・needs-manual・needs-local)による人の判断待ち・手元の作業待ち・見回り待ちなので、
    # draft では開いた・draft に戻した・閉じた・待ちのラベルの付け外しのときだけ動かす。
    # CI は draft で全ジョブを飛ばす(test.yml)ので、飛ばした回では動かさない
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target' && github.event.pull_request.draft
        && (contains(fromJSON('["opened","reopened","converted_to_draft","closed"]'), github.event.action)
          || (github.event.action == 'labeled'
            && (startsWith(github.event.label.name, '状態:')
              || contains(fromJSON('["needs-human","needs-local","needs-manual","needs-decision"]'), github.event.label.name)))
          || (github.event.action == 'unlabeled' && startsWith(github.event.label.name, '状態:'))))
      || (github.event_name == 'pull_request_target' && !github.event.pull_request.draft && (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'ready_for_review')
        || startsWith(github.event.label.name, '状態:')
        || (github.event.action == 'labeled'
          && contains(fromJSON('["needs-human","needs-local","needs-manual","needs-decision","needs-approval","ai-in-actions"]'), github.event.label.name))))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number
        && !contains(fromJSON('["success","skipped"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 状態を出し直して、ラベルを付け替える
        run: |
          if [ -n "$NUMBER" ]; then
            numbers=$NUMBER
          else
            numbers=$(gh pr list -R "$REPO" --state open --limit 100 --json number --jq '.[].number')
          fi
          for n in $numbers; do
            bash .github/scripts/pr-status.sh "$REPO" "$n" || echo "::warning::#$n の状態のラベルを付け替えられなかった"
          done
