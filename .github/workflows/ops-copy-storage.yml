name: ops-copy-storage

# 画像のコピースクリプト(ops/migrate/copy-storage.sh)のテスト。DB は使わない。
# 必須のチェックにできるよう、paths で絞らずにすべての PR で動かす
# (絞ると、関係の無い PR でチェックが来ずに止まる)。

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  copy-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck ops/migrate/copy-storage.sh ops/migrate/tests/copy-storage.test.sh

      - name: Test copy-storage.sh
        run: ops/migrate/tests/copy-storage.test.sh
