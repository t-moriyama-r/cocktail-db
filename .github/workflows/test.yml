name: test

on:
  pull_request:
    branches: [develop, staging, release]
  push:
    branches: [develop]
  # deploy.yml・deploy-env.yml から呼び、テストが通ったときだけデプロイする
  workflow_call:
  # PR のブランチで流し直す(ci-rerun.yml)。base の付け替えや GITHUB_TOKEN の push では pull_request の回が起きないため
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      # 旧 DB の接続(legacy)。DB 名は phpunit.xml が legacy_test に固定する
      LEGACY_DB_HOST: 127.0.0.1
      LEGACY_DB_PORT: 3306
      LEGACY_DB_USERNAME: root
      LEGACY_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      # 旧 DB を読む移行テスト用の 2 つ目の DB
      - name: Create legacy test database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES LIKE 'legacy_test'" | grep -q legacy_test

      - name: Run tests (including the db group)
        working-directory: backend
        run: php artisan test

      # BE の変更で API の形が変わったのに openapi.json を更新し忘れていたら止める(FE の型がずれるため)
      - name: Check OpenAPI is up to date
        working-directory: backend
        run: |
          php artisan scramble:export --path=../openapi/openapi.json
          git diff --exit-code -- ../openapi/openapi.json

  # テストから呼ばれない PHP ファイル(config・routes・migrations など)の構文エラーと、書式の乱れと、型の誤りを止める
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # vendor を入れる前に、リポジトリにある PHP ファイルだけを見る(Blade は PHP として読めないので外す)
      - name: Syntax check (php -l)
        run: git ls-files -z '*.php' ':!:*.blade.php' | xargs -0 -n1 php -l -d display_errors=1

      - name: Install backend
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      # 型の合わない呼び出しなどを、テストで通らない経路の分まで止める。設定と検査から外すものは phpstan.neon
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # 通知のワークフローが使う Slack のスクリプト。curl・gh を偽物にして流すので、Slack にも GitHub にも触らない
  slack-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck --severity=warning .github/scripts/slack-*.sh .github/scripts/tests/slack.test.sh

      - name: Test
        run: bash .github/scripts/tests/slack.test.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      # 型チェックを openapi.json から作り直した型に対して行う
      - name: Generate API types
        run: npm run gen:api

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # 本番と同じく、ビルドした FE を Laravel から同じオリジンで配信し、ブラウザで画面を確かめる
  e2e:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: e2e
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed the E2E database
        working-directory: backend
        run: php artisan migrate --force --seed --seeder=E2eSeeder

      - name: Build frontend into backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npx tsc -p .

      # BE は playwright.config.ts の webServer が php artisan serve で起こす
      - name: Run E2E
        working-directory: e2e
        run: npm test

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
