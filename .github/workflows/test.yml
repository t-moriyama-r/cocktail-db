name: test

on:
  pull_request:
    branches: [develop, staging, release]
  push:
    branches: [develop]
  # deploy.yml・deploy-env.yml から呼び、テストが通ったときだけデプロイする
  workflow_call:
  # PR のブランチで流し直す(ci-rerun.yml・ai-conflict-resolve.yml)。base の付け替えや GITHUB_TOKEN・ボットの push では pull_request の回が起きない・承認待ちのまま走らないため
  workflow_dispatch:

permissions:
  contents: read

# staging → release の PR(向き先が release)は、develop → staging で一通り確かめた後なので、lint とテストの確認(必須の
# backend・backend-lint・frontend・actionlint)だけにする。e2e・scripts・ops-db は飛ばす(base_ref は PR 以外では空なので、そのほかの回は全部流れる)
#
# PR に続けて push したら、前の回は取り消す(private ではジョブが動いた分だけ課金されるため)。
# deploy-*.yml から workflow_call で呼んだ回は、github.workflow が呼んだ側の名前になるので、PR の回とは別の列になる
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      # 旧 DB の接続(legacy)。DB 名は phpunit.xml が legacy_test に固定する
      LEGACY_DB_HOST: 127.0.0.1
      LEGACY_DB_PORT: 3306
      LEGACY_DB_USERNAME: root
      LEGACY_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          tools: composer:v2
          coverage: none

      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      # 旧 DB を読む移行テスト用の 2 つ目の DB
      - name: Create legacy test database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS legacy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES LIKE 'legacy_test'" | grep -q legacy_test

      - name: Run tests (including the db group)
        working-directory: backend
        run: php artisan test

      # BE の変更で API の形が変わったのに openapi.json を更新し忘れていたら止める(FE の型がずれるため)
      - name: Check OpenAPI is up to date
        working-directory: backend
        run: |
          php artisan scramble:export --path=../openapi/openapi.json
          git diff --exit-code -- ../openapi/openapi.json

  # テストから呼ばれない PHP ファイル(config・routes・migrations など)の構文エラーと、書式の乱れと、型の誤りを止める
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # vendor を入れる前に、リポジトリにある PHP ファイルだけを見る(Blade は PHP として読めないので外す)
      - name: Syntax check (php -l)
        run: git ls-files -z '*.php' ':!:*.blade.php' | xargs -0 -n1 php -l -d display_errors=1

      - name: Install backend
        run: composer install --no-interaction --prefer-dist

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      # 型の合わない呼び出しなどを、テストで通らない経路の分まで止める。設定と検査から外すものは phpstan.neon
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # ワークフローの YAML の誤り(構文・存在しないジョブや step の参照・式の型など)と、run に書いたシェルの誤りを止める。
  # run のシェルは actionlint が shellcheck に渡す。scripts ジョブと同じく、GraphQL・jq の $ を単一引用符で渡すので info(SC2016)と
  # style は見ない。staging・release 向けの PR でも流す(数秒で終わり、必須のチェックにするため)
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 手元でも同じ結果になるよう、image の版を固定する(手元のコマンドは CLAUDE.md の「ワークフローを変えたら」)
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        env:
          SHELLCHECK_OPTS: --severity=warning
        with:
          args: -color

  # DB を使わないシェルスクリプトの検査とテスト。どれも数秒で終わるので 1 つのジョブで順に流す
  # (private ではジョブごとに 1 分に切り上げて課金されるため)。必須のチェックにはしていない
  scripts:
    if: github.base_ref != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # AI 駆動開発・通知のワークフローが使うスクリプト(.github/scripts)。curl・gh を偽物にして流すので、Slack にも GitHub にも触らない。
      # GraphQL・jq の $ を単一引用符で渡すので、info(SC2016)は見ない
      - name: ShellCheck (.github/scripts)
        run: shellcheck --severity=warning .github/scripts/*.sh .github/scripts/tests/*.sh

      - name: Test .github/scripts
        run: |
          for t in .github/scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # 画像のコピースクリプト(ops/migrate/copy-storage.sh)
      - name: ShellCheck (copy-storage)
        run: shellcheck ops/migrate/copy-storage.sh ops/migrate/tests/copy-storage.test.sh

      - name: Test copy-storage.sh
        run: ops/migrate/tests/copy-storage.test.sh

      # バックアップの世代管理・毎日のバックアップ・手元への取り込み(ops/backup)。DB を使わない
      - name: ShellCheck (backup rotation)
        run: shellcheck ops/backup/prune-backups.sh ops/backup/daily-backup.sh ops/backup/pull-backups.sh ops/backup/tests/prune-backups.test.sh ops/backup/tests/daily-backup.test.sh ops/backup/tests/pull-backups.test.sh

      - name: Test backup rotation
        env:
          PULL_TEST_REQUIRE_RSYNC: 1
        run: |
          bash ops/backup/tests/prune-backups.test.sh
          bash ops/backup/tests/daily-backup.test.sh
          bash ops/backup/tests/pull-backups.test.sh

  # MariaDB を使う運用スクリプト(ops/backup)のテスト。1 つの MariaDB で順に流す(テストごとに別の DB 名を使う)。必須のチェックにはしていない
  ops-db:
    if: github.base_ref != 'release'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck ops/backup/archive-storage.sh ops/backup/tests/archive-storage.test.sh ops/backup/dump-db.sh ops/backup/tests/dump-db.test.sh ops/backup/verify-restore.sh ops/backup/tests/verify-restore.test.sh

      # 画像の退避スクリプト(ops/backup/archive-storage.sh)
      - name: Test archive-storage.sh
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: ops/backup/tests/archive-storage.test.sh

      # ops/backup/dump-db.sh を MariaDB に向けて流し、ダンプを別の DB に入れられること・出力にパスワードが出ないことを確かめる。
      # ランナーに入っている mysqldump は MySQL 8 のもので、MariaDB に向けると落ちることがある。
      # サーバーと同じ MariaDB のクライアント(mariadb-dump)で流すため、mariadb の image の中で動かす
      - name: Test dump-db.sh
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w \
            -e DUMP_TEST_DB_HOST=127.0.0.1 \
            -e DUMP_TEST_DB_PORT=3306 \
            -e DUMP_TEST_DB_ROOT_PASSWORD=root \
            -e DUMP_TEST_REQUIRE_DB=1 \
            mariadb:10.11 bash ops/backup/tests/dump-db.test.sh

      # ops/backup/verify-restore.sh で、dump-db.sh のダンプを使い捨ての DB に戻して元の DB と比べ、一致すれば通り、
      # ダンプの後に 1 行消す・値を変えると失敗することを確かめる。dump-db.sh と同じく mariadb の image の中で動かす
      - name: Test verify-restore.sh
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w \
            -e VERIFY_TEST_DB_HOST=127.0.0.1 \
            -e VERIFY_TEST_DB_PORT=3306 \
            -e VERIFY_TEST_DB_ROOT_PASSWORD=root \
            -e VERIFY_TEST_REQUIRE_DB=1 \
            mariadb:10.11 bash ops/backup/tests/verify-restore.test.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      # 型チェックを openapi.json から作り直した型に対して行う
      - name: Generate API types
        run: npm run gen:api

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # 本番と同じく、ビルドした FE を Laravel から同じオリジンで配信し、ブラウザで画面を確かめる
  e2e:
    if: github.base_ref != 'release'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: e2e
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed the E2E database
        working-directory: backend
        run: php artisan migrate --force --seed --seeder=E2eSeeder

      - name: Build frontend into backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check
        working-directory: e2e
        run: npx tsc -p .

      # BE は playwright.config.ts の webServer が php artisan serve で起こす
      - name: Run E2E
        working-directory: e2e
        run: npm test

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
