# CodeRabbit の指摘への対応が終わり(最新のコミットを見て、未解決の指摘が無い)、CI が緑の PR を、自動でマージする
#
# 既定のブランチの .github/ai-dev.yml に `merge: auto` があるときだけ動く(無い・review なら何もしない)。
# 次のどれかに当てはまる PR はマージしない。理由はジョブのログに出す
# - 下書き・向き先が develop 以外(release へのマージはデプロイになるので、人がする)・作ったのがオーナー以外
# - ラベル needs-human / needs-decision / needs-approval / ai-in-actions / no-auto-merge が付いている
# - 閉じる issue に needs-review が付いている(人が中身を確かめるもの)
# - CodeRabbit(上限で動かなかったときは、代わりの Claude。ai-claude-review.yml)が最新のコミットをまだ見ていない・未解決の指摘が残っている
# - チェックが 1 つも無い・終わっていない・失敗している・コンフリクトしている
#
# マージは普通のマージ(マージコミット)。GITHUB_TOKEN でマージするので、develop への push で動くワークフローは起きず、
# Closes #N の issue も閉じない・ブランチの自動削除も効かない。issue を閉じるのとブランチを消すのは、マージの後にこのワークフローがする
name: AI 自動マージ

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [test]   # CI のワークフロー名に合わせる
    types: [completed]
  pull_request_target:
    types: [unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: PR の番号
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: ai-auto-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha || inputs.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # PR の上で起きたことだけ。issue_comment は CodeRabbit のコメント(指摘なしで終わったときはレビューが付かない)だけ
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request_target'
      || (github.event_name == 'pull_request_review' && github.event.review.user.login == 'coderabbitai[bot]')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'coderabbitai[bot]')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NUMBER: ${{ inputs.number || github.event.pull_request.number || github.event.issue.number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: 条件を確かめてマージする
        run: |
          skip() { echo "見送り: $*"; exit 0; }

          setting=$(gh api "repos/$REPO/contents/.github/ai-dev.yml?ref=$DEFAULT_BRANCH" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          grep -Eq '^merge:[[:space:]]*auto([[:space:]]|#|$)' <<<"$setting" || skip ".github/ai-dev.yml が merge: auto ではない"

          # workflow_run では PR の番号が来ないことがあるので、コミットから探す
          if [ -z "$NUMBER" ] && [ -n "$HEAD_SHA" ]; then
            NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          [ -n "$NUMBER" ] || skip "PR が見つからない"

          pr=$(gh pr view "$NUMBER" -R "$REPO" --json state,isDraft,baseRefName,headRefOid,author,labels,mergeable,isCrossRepository,commits,closingIssuesReferences)
          head=$(jq -r .headRefOid <<<"$pr")
          [ "$(jq -r .state <<<"$pr")" = OPEN ] || skip "#$NUMBER は開いていない"
          [ "$(jq -r .isDraft <<<"$pr")" = false ] || skip "#$NUMBER は下書き"
          [ "$(jq -r .baseRefName <<<"$pr")" = "$DEFAULT_BRANCH" ] || skip "#$NUMBER の向き先が $DEFAULT_BRANCH ではない"
          [ "$(jq -r .isCrossRepository <<<"$pr")" = false ] || skip "#$NUMBER はフォークから"
          [ "$(jq -r .author.login <<<"$pr")" = "$OWNER" ] || skip "#$NUMBER を作ったのがオーナーではない"

          held=$(jq -r '[.labels[].name | select(IN("needs-human","needs-decision","needs-approval","ai-in-actions","no-auto-merge"))] | join(",")' <<<"$pr")
          [ -z "$held" ] || skip "#$NUMBER にラベル $held が付いている"

          # 閉じる issue には、別のリポジトリの issue(Closes owner/repo#N)も入るので、このリポジトリのものに絞る
          issues=$(jq -r --arg repo "$REPO" '.closingIssuesReferences[]
            | select(.repository.owner.login + "/" + .repository.name == $repo) | .number' <<<"$pr")
          for issue in $issues; do
            gh issue view "$issue" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx needs-review \
              && skip "#$NUMBER が閉じる #$issue に needs-review が付いている"
          done

          # CodeRabbit が最新のコミットを見たか。指摘があればそのコミットへのレビューが付き、
          # 無ければ「Review finished」「No actionable comments」のコメントだけが付く。
          # CodeRabbit が上限で動かなかったときは、ai-claude-review.yml が目印付きのレビューをそのコミットに付ける。
          # CodeRabbit はスレッドへの返信のたびに本文が空のレビューを最新のコミットに付けるので、本文の無いレビューは数えない
          pushed=$(jq -r '.commits[-1].committedDate' <<<"$pr")
          reviewed=$(gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" \
            | jq --arg head "$head" 'add // [] | any(.commit_id == $head and ((.user.login == "coderabbitai[bot]" and (.body // "" | length) > 0)
                or (.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-dev:claude-review -->")))))')
          finished=$(gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
            | jq --arg since "$pushed" 'add // [] | map(select(.user.login == "coderabbitai[bot]" and .created_at > $since))
                | (last // {}).body // "" | test("Review finished|No actionable comments|LGTM")')
          [ "$reviewed" = true ] || [ "$finished" = true ] || skip "CodeRabbit(か代わりの Claude)が最新のコミット ${head:0:7} をまだ見ていない"

          unresolved=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { isResolved comments(first: 1) { nodes { author { login } } } } }
                }
              }
            }' | jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length')
          [ "$unresolved" = 0 ] || skip "#$NUMBER に未解決の指摘が $unresolved 件ある"

          # このワークフロー自身のジョブは除く
          checks=$(gh api --paginate --slurp "repos/$REPO/commits/$head/check-runs?per_page=100" \
            | jq '[.[].check_runs[] | select(.name != "auto-merge")]')
          [ "$(jq length <<<"$checks")" -gt 0 ] || skip "${head:0:7} にチェックが 1 つも無い"
          pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(",")' <<<"$checks")
          [ -z "$pending" ] || skip "チェックが終わっていない: $pending"
          failed=$(jq -r '[.[] | select(.conclusion | IN("success","skipped","neutral") | not) | .name] | join(",")' <<<"$checks")
          [ -z "$failed" ] || skip "チェックが失敗している: $failed"

          # GitHub はマージできるかを後から計算するので、UNKNOWN の間は少し待って取り直す
          for i in 1 2 3 4 5 6; do
            mergeable=$(gh pr view "$NUMBER" -R "$REPO" --json mergeable --jq .mergeable)
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          [ "$mergeable" = MERGEABLE ] || skip "#$NUMBER はマージできない状態($mergeable)"

          gh pr merge "$NUMBER" -R "$REPO" --merge --match-head-commit "$head"
          echo "#$NUMBER をマージした"

          # GITHUB_TOKEN でマージすると、Closes #N の issue は閉じず、ブランチの自動削除も効かないので、ここでする。
          # マージした後は PR が開いていないので、再実行しても最初の確認で見送られる。後片付けを先にし、失敗してもジョブを止めない
          for issue in $issues; do
            if gh issue close "$issue" -R "$REPO" --reason completed --comment "<!-- ai-dev:agent -->
          #$NUMBER のマージで完了。"; then echo "#$issue を閉じた"; else echo "::warning::#$issue を閉じられなかった"; fi
          done
          # GitHub のブランチの自動削除と同じく、保護されたブランチと、ほかの開いた PR が使っているブランチは消さない
          branch=$(gh pr view "$NUMBER" -R "$REPO" --json headRefName --jq .headRefName)
          protected=$(gh api "repos/$REPO/branches/$branch" --jq .protected 2>/dev/null) || protected=unknown
          others=$( (gh pr list -R "$REPO" --state open --head "$branch" --json number --jq '.[].number'
            gh pr list -R "$REPO" --state open --base "$branch" --json number --jq '.[].number') | paste -sd, - || true)
          if [ "$protected" != false ]; then
            echo "ブランチ $branch は消さない(保護: $protected)"
          elif [ -n "$others" ]; then
            echo "ブランチ $branch は消さない(開いた PR #$others が使っている)"
          elif gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
            echo "ブランチ $branch を消した"
          else
            echo "::warning::ブランチ $branch を消せなかった"
          fi

          gh pr comment "$NUMBER" -R "$REPO" --body "<!-- ai-dev:agent -->
          AI レビュアーの指摘への対応が終わり(未解決の指摘なし)、CI も緑だったので、自動でマージした(\`.github/ai-dev.yml\` の \`merge: auto\`)。"
