# CodeRabbit の指摘への対応が終わり(最新のコミットを見て、指摘が残っていない)、CI が緑の PR を、マージできる状態とみなし、
# 自動でマージする。人の手でマージする PR なら、マージせずに needs-approval を付けて人に知らせる。
# 人に頼むのを、自動のレビューと CI が終わった後の 1 回にするため、マージできる状態かの判定はここだけで行う
#
# 人の手でマージする PR: 既定のブランチの .github/ai-dev.yml が `merge: auto` でない・ラベル no-auto-merge が付いている・
# 閉じる issue に needs-review が付いている(人が中身を確かめるもの)
#
# 向き先が staging・release の PR(昇格の PR)は、自動ではマージしない。マージはデプロイになるので、必ず人がする。
# 中身は develop に入る前に PR ごとにレビュー済みで、head が保護されたブランチ(develop・staging)なので Actions の Claude Code が指摘を直せない。
# そのため、AI レビューの指摘が残っていてもマージを止めず(残っている件数をコメントに書く)、CI が緑で、いまのコミットを
# AI がレビューし終えたら、needs-approval を付けて人に知らせる
#
# 次のどれかに当てはまる PR は、まだマージできる状態ではないので何もしない。理由はジョブのログに出す
# - 下書き・向き先が develop・staging・release 以外・作ったのがオーナー以外
# - ラベル needs-human / needs-decision / needs-approval / ai-in-actions が付いている(人の番か、Actions が対応している途中)
# - CodeRabbit(上限で動かなかったときは、代わりの Claude。ai-claude-review.yml)が最新のコミットをまだ見ていない・指摘が残っている。
#   自動でマージする PR は未解決のスレッドが 0 件。人の手でマージする PR は、エージェントが直さない理由を返して未解決のまま残る
#   スレッドもあるので、返信待ちのスレッドが 0 件(その判断も人が見る)
# - チェックが 1 つも無い・終わっていない・失敗している・コンフリクトしている(コンフリクトなら ai-conflict-resolve.yml を呼ぶ)
#
# 自動でマージする PR で、ほかの条件がそろい、止めているのがエージェントの返信済みで未解決のスレッドだけのときは、
# 人が解決するまで誰の番でもないまま止まるので、残っているスレッドへのリンクと決めてほしいことをコメントし、needs-human を付けて
# Slack に知らせる(.github/scripts/thread-handoff.sh。同じコミットでは 1 回だけ)。スレッドの解決ではワークフローが起きないので、
# 人がすべて解決したら、見回り(ai-review-sweep.yml)がその needs-human を外して、ここを呼び直す(#388)
#
# マージは普通のマージ(マージコミット)。GITHUB_TOKEN でマージするので、develop への push で動くワークフローは起きず、
# Closes #N の issue も閉じない・ブランチの自動削除も効かない。issue を閉じるのとブランチを消すのは、マージの後にこのワークフローがする。
# GITHUB_TOKEN で付けたラベルは通知のワークフローを起こさないので、needs-approval を付けたら notify-needs-human.yml を直接呼ぶ。
# 同じ理由で、ワークフローを変えた PR をマージしたら notify-workflow-merged.yml を、develop にマージしたら deploy-dev.yml を直接呼ぶ
name: マージできるかの判定と自動マージ

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    # CodeRabbit は依頼への返信を「Review triggered」で作ってから「Review finished」に書き換えるので、書き換えでも起動する
    types: [created, edited]
  workflow_run:
    workflows: [test, evidence-gate]   # CI のワークフロー名に合わせる
    types: [completed]
  pull_request_target:
    types: [unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: PR の番号
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write   # 通知のワークフローを gh workflow run で呼ぶ。Claude Code を動かさないので渡してよい

# CI の終わりと CodeRabbit の「Review finished」は同時に来やすい。同じ PR の回を 1 列に並べ、人に 2 回知らせないようにする
concurrency:
  group: ai-auto-merge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # PR の上で起きたことだけ。issue_comment は CodeRabbit のレビューの終わりを表すコメント(指摘なしで終わったときはレビューが付かない)だけ。
    # CodeRabbit はサマリーのコメントを何度も書き換えるので、ほかのコメントでは動かさない(private では動いたジョブが 1 分ずつ課金される)。
    # ラベルを外したときは、マージを止めるラベルが外れたときだけ。CI は既定のブランチへの push の回(PR ではない)を除く。
    # develop から staging への PR の CI は、head のブランチが develop なので、event が pull_request の回だけを拾う
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_target' && (github.event.action != 'unlabeled'
        || contains(fromJSON('["needs-human","needs-decision","needs-approval","ai-in-actions","no-auto-merge"]'), github.event.label.name)))
      || (github.event_name == 'pull_request_review' && github.event.review.user.login == 'coderabbitai[bot]')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'coderabbitai[bot]'
        && (contains(github.event.comment.body, 'Review finished') || contains(github.event.comment.body, 'No actionable comments')
          || contains(github.event.comment.body, 'LGTM')))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.head_branch != github.event.repository.default_branch
          || github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NUMBER: ${{ inputs.number || github.event.pull_request.number || github.event.issue.number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # 返信待ちのスレッドを数えるスクリプト。PR のコードではなく、動いているワークフローと同じ版を使う
      - uses: actions/checkout@v6
        with:
          # pull_request_review の既定の ref は PR のマージ ref なので、既定のブランチに固定する(書き込み権限のジョブで PR 側のスクリプトを動かさない)
          ref: ${{ github.event.repository.default_branch }}
          path: .ai-dev
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 条件を確かめて、マージするか人に知らせる
        run: |
          skip() { echo "見送り: $*"; exit 0; }

          # 人の手でマージする理由。空なら自動でマージする
          human=""
          # 取得に失敗したときに「merge: auto ではない」と取り違えて人を呼ばないよう、見送る
          content=$(gh api "repos/$REPO/contents/.github/ai-dev.yml?ref=$DEFAULT_BRANCH" --jq .content) || skip "ai-dev.yml を読めない"
          setting=$(base64 -d <<<"$content") || skip "ai-dev.yml を読めない"
          grep -Eq '^merge:[[:space:]]*auto([[:space:]]|#|$)' <<<"$setting" || human=".github/ai-dev.yml が merge: auto ではない"

          # workflow_run では PR の番号が来ないことがあるので、コミットから探す
          if [ -z "$NUMBER" ] && [ -n "$HEAD_SHA" ]; then
            NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          [ -n "$NUMBER" ] || skip "PR が見つからない"

          pr=$(gh pr view "$NUMBER" -R "$REPO" --json state,isDraft,baseRefName,headRefOid,author,labels,mergeable,isCrossRepository,commits,closingIssuesReferences)
          head=$(jq -r .headRefOid <<<"$pr")
          [ "$(jq -r .state <<<"$pr")" = OPEN ] || skip "#$NUMBER は開いていない"
          [ "$(jq -r .isDraft <<<"$pr")" = false ] || skip "#$NUMBER は下書き"
          # 昇格の PR(staging・release 向け)は、自動ではマージしない。人の手でマージするものとして扱う
          base=$(jq -r .baseRefName <<<"$pr")
          promotion=false
          case "$base" in
            staging | release) promotion=true ;;
            *) [ "$base" = "$DEFAULT_BRANCH" ] || skip "#$NUMBER の向き先が $DEFAULT_BRANCH・staging・release ではない" ;;
          esac
          [ "$(jq -r .isCrossRepository <<<"$pr")" = false ] || skip "#$NUMBER はフォークから"
          [ "$(jq -r .author.login <<<"$pr")" = "$OWNER" ] || skip "#$NUMBER を作ったのがオーナーではない"

          held=$(jq -r '[.labels[].name | select(IN("needs-human","needs-decision","needs-approval","ai-in-actions"))] | join(",")' <<<"$pr")
          [ -z "$held" ] || skip "#$NUMBER にラベル $held が付いている"
          if jq -e '.labels | any(.name == "no-auto-merge")' <<<"$pr" >/dev/null; then human="ラベル no-auto-merge が付いている"; fi

          # 閉じる issue には、別のリポジトリの issue(Closes owner/repo#N)も入るので、このリポジトリのものに絞る
          issues=$(jq -r --arg repo "$REPO" '.closingIssuesReferences[]
            | select(.repository.owner.login + "/" + .repository.name == $repo) | .number' <<<"$pr")
          for issue in $issues; do
            if gh issue view "$issue" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx needs-review; then
              human="閉じる #$issue に needs-review が付いている(人が中身を確かめる)"
            fi
          done

          # 昇格の PR は、ほかの理由(no-auto-merge・needs-review)より、デプロイになることを理由にする
          if [ "$promotion" = true ]; then human="向き先が $base なので、マージはデプロイになる(人がマージする)"; fi

          # CodeRabbit が最新のコミットを見たか。指摘があればそのコミットへのレビューが付き、
          # 無ければ「Review finished」「No actionable comments」のコメントだけが付く(どちらか片方のこともあり、後から別のコメントが続くこともある)。
          # CodeRabbit が上限で動かなかったときは、ai-claude-review.yml が目印付きのレビューをそのコミットに付ける。
          # CodeRabbit はスレッドへの返信のたびに本文が空のレビューを最新のコミットに付けるので、本文の無いレビューは数えない
          pushed=$(jq -r '.commits[-1].committedDate' <<<"$pr")
          reviewed=$(gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/reviews?per_page=100" \
            | jq --arg head "$head" 'add // [] | any(.commit_id == $head and ((.user.login == "coderabbitai[bot]" and (.body // "" | length) > 0)
                or (.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-dev:claude-review -->")))))')
          finished=$(gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
            | jq --arg since "$pushed" 'add // [] | map(select(.user.login == "coderabbitai[bot]" and .created_at > $since))
                | any(.body // "" | test("Review finished|No actionable comments|LGTM"))')
          [ "$reviewed" = true ] || [ "$finished" = true ] || skip "CodeRabbit(か代わりの Claude)が最新のコミット ${head:0:7} をまだ見ていない"

          # 昇格の PR は、残っている指摘でマージを止めない(件数を人に知らせるだけ)
          unanswered=0
          if [ "$promotion" = true ]; then
            unanswered=$(bash .ai-dev/.github/scripts/unanswered-review-threads.sh "$REPO" "$NUMBER")
          elif [ -n "$human" ]; then
            unanswered=$(bash .ai-dev/.github/scripts/unanswered-review-threads.sh "$REPO" "$NUMBER")
            [ "$unanswered" = 0 ] || skip "#$NUMBER に返信待ちの指摘が $unanswered 件ある"
          else
            # 返信待ちのスレッド(AI レビュアーの指摘で、エージェントがまだ返していないもの)は ai-review-loop.yml が対応するので見送る。
            # それ以外の未解決のスレッド(エージェントが返したもの・人が立てたもの)だけなら、
            # 人が解決するまで止まるので、ほかの条件(チェック・コンフリクト)を見たうえで、最後に人に頼む(#388)
            threads=$(bash .ai-dev/.github/scripts/thread-handoff.sh check "$REPO" "$NUMBER")
            read -r unresolved waiting <<<"$threads"
            [ "$waiting" = 0 ] || skip "#$NUMBER に返信待ちの指摘が $waiting 件ある(未解決は $unresolved 件)"
          fi

          # このワークフロー自身のジョブは除く
          checks=$(gh api --paginate --slurp "repos/$REPO/commits/$head/check-runs?per_page=100" \
            | jq '[.[].check_runs[] | select(.name != "auto-merge")]')
          [ "$(jq length <<<"$checks")" -gt 0 ] || skip "${head:0:7} にチェックが 1 つも無い"
          # draft の間は CI(test.yml)・evidence-gate のジョブを飛ばす(#410)。飛ばしたジョブのチェックは成功に数えられるので、
          # GITHUB_TOKEN で ready にした(ready_for_review の回が起きない)PR が、CI を流さないまま通らないよう、
          # いまのコミットで CI の pull_request の回が成功していること、evidence-gate を飛ばさずに確かめたことを求める
          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100"             --jq '[.workflow_runs[] | select((.path | endswith("/test.yml")) and .conclusion == "success")] | length')
          [ "$ci" -gt 0 ] || skip "${head:0:7} で CI(test.yml)の pull_request の回がまだ成功していない(draft のときに飛ばした回だけ・走っている途中)"
          # develop 向けの PR は、evidence-gate のチェックが無い間(ready 直後でまだ走っていない・走らなかった)もマージしない
          if [ "$base" = develop ]; then
            [ "$(jq '[.[] | select(.name == "evidence-gate" and .conclusion != "skipped")] | length' <<<"$checks")" -gt 0 ]               || skip "${head:0:7} に evidence-gate のチェックがまだ無い(draft のときに飛ばしたものだけ)"
          fi
          pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(",")' <<<"$checks")
          [ -z "$pending" ] || skip "チェックが終わっていない: $pending"
          failed=$(jq -r '[.[] | select(.conclusion | IN("success","skipped","neutral") | not) | .name] | join(",")' <<<"$checks")
          [ -z "$failed" ] || skip "チェックが失敗している: $failed"

          # GitHub はマージできるかを後から計算するので、UNKNOWN の間は少し待って取り直す
          for _ in 1 2 3 4 5 6; do
            mergeable=$(gh pr view "$NUMBER" -R "$REPO" --json mergeable --jq .mergeable)
            [ "$mergeable" != UNKNOWN ] && break
            sleep 5
          done
          if [ "$mergeable" = CONFLICTING ]; then
            # 取り込んで直すのは ai-conflict-resolve.yml(1 時間ごとにも見回る)。見つけたときに早く拾わせる
            gh workflow run ai-conflict-resolve.yml -R "$REPO" -f number="$NUMBER" || echo "::warning::ai-conflict-resolve.yml を呼べなかった"
          fi
          [ "$mergeable" = MERGEABLE ] || skip "#$NUMBER はマージできない状態($mergeable)"

          if [ -n "$human" ]; then
            # 待っている間に、ほかのきっかけの回が先に付けていれば、もう知らせてある
            gh pr view "$NUMBER" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx needs-approval \
              && skip "#$NUMBER にはもう needs-approval が付いている"
            gh label create needs-approval -R "$REPO" --color fbca04 --description "人の承認(マージ)を待っている PR" 2>/dev/null || true
            # エージェントが、いまのコミットの後に見てほしいところをまとめていれば、そこへのリンクを添える
            summary=$(gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
              | jq -r --arg since "$pushed" 'add // [] | map(select(.created_at > $since and (.body | contains("ai-dev:approval-summary")))) | last | .html_url // empty')
            # Slack の通知とまとめは、この目印のコメントを引用する(まとめは最初の 1 行だけ)
            if [ "$promotion" = true ]; then
              ready="マージできる状態になった(AI レビュー済み・CI 緑・コンフリクトなし)。人の手でマージする PR なので、確かめてマージしてほしい。"
              remaining="- AI レビューの指摘: ${unanswered} 件が返信待ちで残っている(中身は develop に入る前にレビュー済みなので、マージは止めていない。見て、マージするか決める)
          "
              ask="- 問題が無ければ、マージすると承認になる。直してほしいことは develop への PR で直す(この PR の head は保護されたブランチなので、Actions の Claude Code は直さない)"
            else
              ready="マージできる状態になった(AI レビューの指摘への対応済み・CI 緑・コンフリクトなし)。人の手でマージする PR なので、確かめてマージしてほしい。"
              remaining=""
              ask="- 問題が無ければ、マージすると承認になる。直してほしいことは、この PR にコメントすると Actions の Claude Code が直し、再レビューの後でまた知らせる"
            fi
            gh pr comment "$NUMBER" -R "$REPO" --body "<!-- ai-dev:agent --> <!-- ai-dev:needs-approval -->
          $ready

          - 人の手でマージする理由: $human
          ${remaining}${summary:+- 見てほしいところ: $summary
          }$ask"
            gh pr edit "$NUMBER" -R "$REPO" --add-label needs-approval
            gh workflow run notify-needs-human.yml -R "$REPO" -f number="$NUMBER" -f label=needs-approval
            gh workflow run pr-status.yml -R "$REPO" -f number="$NUMBER"
            echo "#$NUMBER はマージできる状態。人の手でマージするので needs-approval を付けて知らせた($human)"
            exit 0
          fi

          # ほかの条件はそろい、止めているのは返信済みで未解決のスレッドだけ。人が解決するか、直してほしいと返すまで進まないので、
          # needs-human で頼む(同じコミットでは 1 回だけ)。人がすべて解決すると、見回り(ai-review-sweep.yml)が外してここへ戻す
          if [ "${unresolved:-0}" != 0 ]; then
            bash .ai-dev/.github/scripts/thread-handoff.sh ask "$REPO" "$NUMBER"
            gh workflow run pr-status.yml -R "$REPO" -f number="$NUMBER" || echo "::warning::状態のラベルを付け替えられなかった"
            exit 0
          fi

          # 昇格の PR は上で人の手でマージするものにしてあるので、ここへは来ない。それでも、デプロイになるマージは絶対にしない
          [ "$base" = "$DEFAULT_BRANCH" ] || skip "#$NUMBER の向き先が $DEFAULT_BRANCH ではないので、自動ではマージしない"
          gh pr merge "$NUMBER" -R "$REPO" --merge --match-head-commit "$head"
          echo "#$NUMBER をマージした"

          # ワークフローを変えた PR なら、オーナーに知らせる(GITHUB_TOKEN のマージは notify-workflow-merged.yml を起こさないので直接呼ぶ)
          if [ "$(gh pr view "$NUMBER" -R "$REPO" --json files --jq 'any(.files[].path; startswith(".github/workflows/"))')" = true ]; then
            gh workflow run notify-workflow-merged.yml -R "$REPO" -f number="$NUMBER" || echo "::warning::ワークフローの変更の通知を呼べなかった"
          fi

          # develop に入れたら dev 環境に出す(GITHUB_TOKEN のマージは deploy-dev.yml の push を起こさないので直接呼ぶ)
          if [ "$(gh pr view "$NUMBER" -R "$REPO" --json baseRefName --jq .baseRefName)" = develop ]; then
            gh workflow run deploy-dev.yml -R "$REPO" --ref develop || echo "::warning::dev 環境へのデプロイを呼べなかった"
          fi

          # GITHUB_TOKEN でマージすると、Closes #N の issue は閉じず、ブランチの自動削除も効かないので、ここでする。
          # マージした後は PR が開いていないので、再実行しても最初の確認で見送られる。後片付けを先にし、失敗してもジョブを止めない
          for issue in $issues; do
            if gh issue close "$issue" -R "$REPO" --reason completed --comment "<!-- ai-dev:agent -->
          #$NUMBER のマージで完了。"; then echo "#$issue を閉じた"; else echo "::warning::#$issue を閉じられなかった"; fi
          done
          # GitHub のブランチの自動削除と同じく、保護されたブランチと、ほかの開いた PR が使っているブランチは消さない
          branch=$(gh pr view "$NUMBER" -R "$REPO" --json headRefName --jq .headRefName)
          protected=$(gh api "repos/$REPO/branches/$branch" --jq .protected 2>/dev/null) || protected=unknown
          others=$( (gh pr list -R "$REPO" --state open --head "$branch" --json number --jq '.[].number'
            gh pr list -R "$REPO" --state open --base "$branch" --json number --jq '.[].number') | paste -sd, - || true)
          if [ "$protected" != false ]; then
            echo "ブランチ $branch は消さない(保護: $protected)"
          elif [ -n "$others" ]; then
            echo "ブランチ $branch は消さない(開いた PR #$others が使っている)"
          elif gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
            echo "ブランチ $branch を消した"
          else
            echo "::warning::ブランチ $branch を消せなかった"
          fi

          gh pr comment "$NUMBER" -R "$REPO" --body "<!-- ai-dev:agent -->
          AI レビュアーの指摘への対応が終わり(未解決の指摘なし)、CI も緑だったので、自動でマージした(\`.github/ai-dev.yml\` の \`merge: auto\`)。"
          # GITHUB_TOKEN でマージしたので閉じた PR のイベントが起きない。状態のラベルを外させる
          gh workflow run pr-status.yml -R "$REPO" -f number="$NUMBER"
