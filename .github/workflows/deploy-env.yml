name: deploy-env

# Basic 認証で閉じた確認用の環境(dev・stg)にデプロイする。deploy-dev.yml(develop → dev)・deploy-stg.yml(staging → stg)から呼ぶ。
# 環境ごとにディレクトリ・DB・ドキュメントルートを分ける。develop の migration が staging の DB を先に進めないように
on:
  workflow_call:
    inputs:
      branch:
        description: 出してよいブランチ(ほかのブランチからは出さない)
        type: string
        required: true
      environment:
        description: GitHub の Environment の名前。APP_ENV にも使う
        type: string
        required: true
      app_dir:
        description: サーバーのホームの下の、アプリ本体のディレクトリ
        type: string
        required: true
      doc_root:
        # cPanel が作った実ディレクトリを、~/<app_dir>/public へのリンクに置き換える。
        # Basic 認証は 1 つ上のディレクトリの .htaccess にあり、デプロイでは触らない
        description: サブドメインのドキュメントルート(ホームからの相対)
        type: string
        required: true
      db_suffix:
        description: DB 名・DB ユーザー名の、cPanel のユーザー名の後ろに付く部分(<user>_<db_suffix>)
        type: string
        required: true
      app_url:
        type: string
        required: true
      force:
        type: boolean
        default: false
      run_tests:
        # 出す前にテスト(test.yml)を流すか。同じコミットを PR の CI で通しているなら、流し直しは分数を使うだけになる
        description: 出す前にテストを流す
        type: boolean
        default: true
    secrets:
      DB_PASSWORD:
        required: true
      BASIC_AUTH:
        required: true
      MIXHOST_SSH_KEY:
        required: true
      MIXHOST_SSH_HOST:
        required: true
      MIXHOST_SSH_USER:
        required: true

permissions:
  contents: read

env:
  APP_DIR: ${{ inputs.app_dir }}
  DOC_ROOT: ${{ inputs.doc_root }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.revision.outputs.deploy }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIXHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.MIXHOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Secret は、ターミナルから値を入れずに作ると空になる。空のまま出すと、途中の DB の接続や最後の動作確認で分かりにくく落ちるので、先に止める
      - name: Check secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
        run: |
          missing=""
          [ -n "$DB_PASSWORD" ] || missing="$missing DB のパスワード"
          case "$BASIC_AUTH" in ?*:?*) ;; *) missing="$missing Basic 認証(<ユーザー名>:<パスワード>)" ;; esac
          if [ -n "$missing" ]; then
            echo "::error::Secret が空か形が違う:$missing。呼び出し元のワークフローが渡している Secret を、リポジトリの Settings → Secrets and variables → Actions で入れ直す"
            exit 1
          fi

      # 前回出したコミットは、サーバーの ~/<app_dir>/REVISION にある(デプロイの最後に書く)
      - name: Compare with the deployed revision
        id: revision
        env:
          FORCE: ${{ inputs.force }}
          BRANCH: ${{ inputs.branch }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$BRANCH" ]; then
            echo "::error::$ENVIRONMENT には $BRANCH だけを出す($GITHUB_REF からは出さない)"
            exit 1
          fi
          deployed=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" \
            "cat ~/${APP_DIR}/REVISION 2>/dev/null || true")
          if [ "$deployed" = "$GITHUB_SHA" ] && [ "$FORCE" != "true" ]; then
            echo "前回と同じコミット(${GITHUB_SHA:0:7})なので出さない"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "出す: ${deployed:0:7} -> ${GITHUB_SHA:0:7}"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.deploy == 'true' && inputs.run_tests
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [check, test]
    # needs のジョブが飛ばされると、既定ではこのジョブも飛ばされる。テストを流さない回(run_tests が false)でも出せるよう、
    # テストは「成功」か「流さない設定で飛ばした」ときに通す。テストが落ちた・取り消されたときは出さない
    if: >-
      !cancelled() && needs.check.result == 'success' && needs.check.outputs.deploy == 'true'
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && !inputs.run_tests))
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend without dev dependencies
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIXHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.MIXHOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # .env・storage(ログ・セッション・アップロードした画像)・REVISION はサーバー側のものを残す。
      # public/storage は storage:link が作るリンクで、手元のビルドには無いので、--delete で消させない(deploy.yml と同じ)
      - name: Upload with rsync
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/storage' \
            --exclude 'REVISION' \
            --exclude 'public/.well-known/' \
            --exclude 'tests/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            backend/ "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}:~/${APP_DIR}/"

      # .env はデプロイのたびに作り直す。DB のパスワードは Secret から、コマンドの引数に載せずに標準入力で送る。
      # APP_KEY は初回だけサーバーで作り、以後はサーバーの .env にあるものを使い続ける(変えるとセッションなどが読めなくなる)。
      # DB 名とユーザー名は cPanel のユーザー名が頭に付く(<user>_<db_suffix>)
      - name: Write .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SSH_USER: ${{ secrets.MIXHOST_SSH_USER }}
          APP_URL: ${{ inputs.app_url }}
          APP_ENV: ${{ inputs.environment }}
          DB_SUFFIX: ${{ inputs.db_suffix }}
        run: |
          printf '%s' "$DB_PASSWORD" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${SSH_USER}@${{ secrets.MIXHOST_SSH_HOST }}" "
            set -e
            cd ~/${APP_DIR}
            umask 077
            db_password=\$(cat)
            # .env では単一引用符の中は展開されない。単一引用符そのものを含むパスワードは書けないので止める
            case \"\$db_password\" in *\\'*) echo 'DB のパスワードに単一引用符が入っている' >&2; exit 1;; esac
            app_key=\$(grep -E '^APP_KEY=base64:' .env 2>/dev/null | head -n 1 | cut -d= -f2- || true)
            cat > .env.new <<ENV
          APP_NAME=cocktail-db
          APP_ENV=${APP_ENV}
          APP_KEY=\${app_key}
          APP_DEBUG=true
          APP_URL=${APP_URL}
          APP_LOCALE=ja
          APP_FALLBACK_LOCALE=en
          LOG_CHANNEL=daily
          LOG_LEVEL=debug
          DB_CONNECTION=mariadb
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${SSH_USER}_${DB_SUFFIX}
          DB_USERNAME=${SSH_USER}_${DB_SUFFIX}
          DB_PASSWORD='\${db_password}'
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          ENV
            mv .env.new .env
            if [ -z \"\$app_key\" ]; then php artisan key:generate --force; fi
          "

      - name: Prepare storage, migrate and cache config
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" "
            set -e
            cd ~/${APP_DIR}
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            # 画像を /storage/<ファイル名> で配信するためのリンク(public/storage → storage/app/public)。
            # 既にあれば作らずに 0 で終わる(deploy.yml と同じ)
            php artisan storage:link
            php artisan migrate --force
            php artisan optimize
          "

      # cPanel がサブドメインを作ったときの実ディレクトリを、アプリの public へのリンクに置き換える(初回だけ)。
      # 中身があったときのために、消さずに退避する
      - name: Link document root
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" "
            set -e
            cd ~
            if [ -e ${DOC_ROOT} ] && [ ! -L ${DOC_ROOT} ]; then mv ${DOC_ROOT} ${DOC_ROOT}.bak-\$(date +%Y%m%d%H%M%S); fi
            ln -sfn ~/${APP_DIR}/public ${DOC_ROOT}
          "

      - name: Smoke test
        env:
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          # Basic 認証が効いていること(資格情報なしでは 401)
          status=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")
          [ "$status" = 401 ] || { echo "::error::資格情報なしで $status が返った(401 のはず)"; exit 1; }
          curl -fsS -u "$BASIC_AUTH" "$APP_URL/up" > /dev/null
          curl -fsS -u "$BASIC_AUTH" "$APP_URL/api/hello"

      # 出したコミットを記録する。次に出すときは、これとブランチの先頭を比べて、同じなら(force を付けない限り)出さない
      - name: Record deployed revision
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" \
            "echo '${GITHUB_SHA}' > ~/${APP_DIR}/REVISION"
