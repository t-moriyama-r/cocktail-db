# CI(test.yml)の pull_request の回がいまのコミットで走っていない PR に、pull_request の回を走らせる。決め方は .github/scripts/ci-rerun.sh
#
# ブランチ保護の必須のチェックに数えられるのは、PR に結び付いた回(pull_request)のチェックだけ。workflow_dispatch で流した回は数えられない(#389)。
# 開いている PR の上に積んだ PR は、土台がマージされてブランチが消えると、base が既定のブランチに付け替わる(人がマージして
# GitHub がブランチを消したときは GitHub が、ai-auto-merge.yml が自動でマージしたときは ai-auto-merge.yml が付け替えてから消す。#463)。
# 付け替えでは test.yml が動かず、必須のチェックがそろわないまま止まる。付け替えのイベント(edited)が起きるとは限らず、
# ai-auto-merge.yml が GITHUB_TOKEN で付け替えたときはワークフローも起きない。ai-auto-merge.yml は付け替えた PR に ci-rerun.sh を直接流すが、
# それが落ちたときや、ほかの付け替えは、1 時間ごとの見回りで拾う。
# schedule が遅れた・落とされたときは、PR に動きがあれば、CI の終わりに patrol-kick.yml が前の回から 1 時間たったところで起こす(#269)。
# edited は、起きたときに早く拾うためのもの。付け替えは push ではないので、push 直後の待ち(MIN_AGE_MINUTES)を 0 にする。
# Actions の Claude(claude[bot])が push したコミットでは、pull_request の回が承認待ち(action_required)のまま走らない(#365)。
# claude[bot] が push するワークフロー(ai-review-loop.yml・ai-draft-sweep.yml)は、終わりに番号を付けてこれを呼ぶ(ai-conflict-resolve.yml は ci-rerun.sh を直接呼ぶ)。
# ai-auto-merge.yml も、いまのコミットで CI が動いていないので見送るときに、番号を付けてこれを呼ぶ(.github/scripts/ci-rerun-request.sh。#268)。
# 承認待ちの回は GITHUB_TOKEN(actions: write)で承認する。pull_request の回が無い(承認できなかった)ときは、オーナーの PAT で PR を閉じて開き直し、
# reopened で pull_request の回を起こす(GITHUB_TOKEN の開き直しではワークフローが起きない)。走った回が終わると ai-auto-merge.yml・
# pr-status.yml(workflow_run)も起きる。PR のコードは checkout しない(pull_request_target で書き込みの権限を持つため)
#
# 必要な secret: CODERABBIT_REQUEST_TOKEN(オーナーの fine-grained PAT。このリポジトリの Pull requests: write)。無ければ開き直さずに人に頼む
name: CI の流し直し
# PR の番号を付けて起こした回は、名前の末尾に「#<番号>」を付ける。patrol-kick.sh は、これの付いた回を全 PR の見回りに数えない
run-name: "${{ inputs.number && format('{0} #{1}', github.workflow, inputs.number) || github.workflow }}"

on:
  pull_request_target:
    types: [edited]
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: PR の番号(空なら開いている PR すべて)
        required: false

permissions: {}

concurrency:
  group: ci-rerun-${{ github.event.pull_request.number || inputs.number || github.event_name }}
  cancel-in-progress: false

jobs:
  rerun:
    # edited は、向き先が変わったときだけ(タイトル・本文の編集では動かない)
    if: github.event_name != 'pull_request_target' || github.event.changes.base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 走らせられないときに、頼むコメントを書いて needs-human を付ける。オーナーの PAT で開き直せなかったときに開き直す
      actions: write         # 承認待ちの回を承認する。notify-needs-human.yml を workflow_dispatch する
    steps:
      - uses: actions/checkout@v6
        with:
          # pull_request_target は既定では PR の向き先のブランチを取るので、スクリプトのある既定のブランチを取る
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: CI の pull_request の回が走っていない PR に走らせる
        env:
          GH_TOKEN: ${{ github.token }}
          # PR を閉じて開き直す。オーナーの fine-grained PAT(このリポジトリの Pull requests: Read and write)。
          # CodeRabbit への依頼(request-review.sh)と同じ PAT で、開き直しに要る権限もこれで足りる
          PR_REOPEN_TOKEN: ${{ secrets.CODERABBIT_REQUEST_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
          MIN_AGE_MINUTES: ${{ github.event_name == 'pull_request_target' && '0' || '10' }}
        # 空なら、スクリプトが開いている PR をすべて見る(${2:-} で受ける)ので、引用符で囲んで 1 つの引数として渡す
        run: .github/scripts/ci-rerun.sh "$REPO" "$NUMBER"
