name: ops-dump-db

# ops/backup/dump-db.sh を CI の MariaDB に向けて流し、ダンプを別の DB に入れられること・
# 出力にパスワードが出ないことを確かめる(テストは ops/backup/tests/dump-db.test.sh)
on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  dump-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck ops/backup/dump-db.sh ops/backup/tests/dump-db.test.sh

      # ランナーに入っている mysqldump は MySQL 8 のもので、MariaDB に向けると落ちることがある。
      # サーバーと同じ MariaDB のクライアント(mariadb-dump)で流すため、mariadb の image の中で動かす
      - name: Run dump-db tests
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/w:ro" -w /w \
            -e DUMP_TEST_DB_HOST=127.0.0.1 \
            -e DUMP_TEST_DB_PORT=3306 \
            -e DUMP_TEST_DB_ROOT_PASSWORD=root \
            -e DUMP_TEST_REQUIRE_DB=1 \
            mariadb:10.11 bash ops/backup/tests/dump-db.test.sh
