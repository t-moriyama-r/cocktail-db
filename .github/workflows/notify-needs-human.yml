# 人の判断・承認が要るものを、Slack に知らせる
#
# - needs-human(PR・issue): AI レビュアーの指摘などで、人に判断を頼んでいる
# - needs-decision(issue): 着手する前に、人に決めてもらうことがある
# - needs-approval(PR): 人の承認(マージ)を待っている
#
# 送り先は secret の SLACK_WEBHOOK_URL(Slack の Incoming Webhook)。無ければ何もせず警告だけ出す
#
# 頼んだときの通知は、きっかけが 2 つあり、1 件につきどちらか一方だけが 1 通送る
# - ラベルが付いたとき: 人(と、人のアカウントで動く手元のエージェント)が付けたものだけ。
#   bot(GitHub Actions の中の Claude Code など)が付けたものは送らない。
#   GITHUB_TOKEN で付けたラベルはワークフローを起こさないので、Actions の中からはこちらに頼れない
# - workflow_dispatch: Actions の中から `gh workflow run` で呼ぶ(GITHUB_TOKEN でも起こせる)。
#   number を空にすると、開いている needs-decision の issue を 1 通にまとめる(issue を一度にたくさん作ったとき)
#
# 頼んだときの通知は 1 回きりなので、毎朝 9:00(日本時間)に、まだ人の番になっているもの(上の 3 つのラベルが
# 付いて開いている PR・issue)を、ラベルごとに待っている日数を添えて 1 通にまとめて知らせ直す。0 件なら送らない。
# 手動では number を空、label を all にすると同じものを送る
#
# 本文が「作成後に書き込む」の仮のもの(目印 ai-dev:pending-body)の issue は、ラベルが付いても送らない。
# issue-breakdown が一度に作る issue で、作り終えたらまとめて 1 通にするため
name: 人の判断・承認を Slack に知らせる

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 9:00(日本時間)
  # コードを checkout しないので、pull_request_target でもフォークのコードは動かない
  pull_request_target:
    types: [labeled]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: PR か issue の番号。空なら、開いている needs-decision の issue をまとめて送る(label が all なら 3 つのラベルすべて)
        required: false
        default: ""
      label:
        description: 何を頼むか(all は number が空のときだけ)
        type: choice
        options: [needs-human, needs-decision, needs-approval, all]
        default: needs-human

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    # 本文はイベントの時点のものを見る(作った直後に本文が書き込まれても、仮の本文だったことで判断する)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.number != '' && inputs.label != 'all')
      || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        && contains(fromJSON('["needs-human","needs-decision","needs-approval"]'), github.event.label.name)
        && github.event.sender.type != 'Bot'
        && !contains(github.event.issue.body, 'ai-dev:pending-body'))
    runs-on: ubuntu-latest
    steps:
      - name: Slack に送る
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number || github.event.pull_request.number || github.event.issue.number }}
          LABEL: ${{ inputs.label || github.event.label.name }}
          SENDER: ${{ github.event_name != 'workflow_dispatch' && github.event.sender.login || '' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::secret SLACK_WEBHOOK_URL が無いので Slack に送らなかった"
            exit 0
          fi

          # issue の API は PR も返す(PR なら pull_request が付く)
          target=$(gh api "repos/$REPO/issues/$NUMBER" \
            | jq '{title, url: .html_url, body: (.body // ""), kind: (if .pull_request then "PR" else "issue" end)}')
          comments=$(gh api --paginate --slurp "repos/$REPO/issues/$NUMBER/comments?per_page=100" | jq 'add // []')
          # PR なら、本文の Closes #N などで結び付いた issue
          if [ "$(jq -r .kind <<<"$target")" = PR ]; then
            issues=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$NUMBER" -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) { closingIssuesReferences(first: 20) { nodes { number title url } } }
                }
              }' | jq '.data.repository.pullRequest.closingIssuesReferences.nodes')
          else
            issues='[]'
          fi

          cat > message.jq <<'JQ'
          # 通知の文面。Slack の mrkdwn で、& < > はエスケープが要る
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def link($url; $label): "<\($url)|\($label | esc)>";
          def clean: gsub("\r"; "") | gsub("<!--[\\s\\S]*?-->"; "") | gsub("^\\s+|\\s+$"; "");
          def quote: (if length > 600 then .[0:600] + "…" else . end) | esc | split("\n") | map("> " + .) | join("\n");
          # 見出しは、手で書いた本文なら ##、issue forms(.github/ISSUE_TEMPLATE)から作った本文なら ###。
          # issue forms は空欄に _No response_ と書くので、それは無いものとして扱う
          def section: ((gsub("\r"; "") | capture("(^|\n)#{2,3} 判断が要ること[^\n]*\n(?<s>[\\s\\S]*?)(\n#{2,3} |$)") | .s) // "")
            | if test("^\\s*_No response_\\s*$") then "" else . end;

          {
            "needs-human":    {head: ":raising_hand: *人の判断が必要です*", ask: "判断してほしいこと", act: "コメントを開いて返信する"},
            "needs-decision": {head: ":thinking_face: *着手する前に決めてほしいことがあります*", ask: "決めてほしいこと", act: "issue を開いてコメントで答える"},
            "needs-approval": {head: ":white_check_mark: *承認を待っています*", ask: "確かめてほしいこと", act: "PR を開いて確かめる"}
          }[$label] as $t
          # 頼むコメントには目印 <!-- ai-dev:<ラベル> --> が付き、ラベルより先に書かれる。
          # 目印が無ければ、needs-decision は本文の「判断が要ること」、ほかは人のいちばん新しいコメントを添える。
          # public のリポジトリでは誰でもコメントできるので、Slack に引用するのは、書き込み権限のある人と
          # GitHub App(Actions の中の Claude Code。リポジトリに入れた App しかコメントできない)のコメントだけにする
          | ["OWNER", "MEMBER", "COLLABORATOR"] as $trusted
          | ($comments | map(select(.author_association as $a | $trusted | index($a)))) as $people
          | ($comments | map(select((.author_association as $a | $trusted | index($a)) or .user.type == "Bot"))
             | map(select(.body | contains("ai-dev:\($label)"))) | last) as $marked
          | ($target.body | section | clean) as $section
          | (if $marked then {text: ($marked.body | clean), url: $marked.html_url}
             elif $label == "needs-decision" and $section != "" then {text: $section, url: $target.url}
             else ($people | map(select(.user.type != "Bot")) | last // {}) as $c
               | {text: ($c.body // "" | clean), url: ($c.html_url // $target.url)}
             end) as $ask
          | {
              unfurl_links: false,
              text: ([
                "\($t.head)(\($repo))",
                "",
                "*\($target.kind)*: \(link($target.url; "#\($number) \($target.title)"))",
                (if $target.kind == "PR" then
                  "*対応 issue*: " + (if ($issues | length) > 0
                    then ($issues | map(link(.url; "#\(.number) \(.title)")) | join("、"))
                    else "なし(PR の本文に Closes #番号 が無い)" end)
                 else empty end),
                (if $sender != "" then "*ラベルを付けた人*: \($sender)" else empty end),
                (if $ask.text != "" then
                  "", "*\($t.ask)*", ($ask.text | quote), "", link($ask.url; $t.act)
                 else
                  "", "頼む中身が見つからなかった。\(link($target.url; "\($target.kind) を開く"))"
                 end),
                (if $label == "needs-approval" then "問題が無ければ、マージすると承認になる。直してほしいことは PR にコメントする" else empty end)
              ] | join("\n"))
            }
          JQ

          jq -n -f message.jq \
            --arg repo "$REPO" --arg number "$NUMBER" --arg label "$LABEL" --arg sender "$SENDER" \
            --argjson target "$target" --argjson comments "$comments" --argjson issues "$issues" \
            | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"

  # 人の番になっているものを 1 通にまとめる。ラベルが付いたときの通知は 1 回きりなので、返事をしないまま
  # 残ったものを毎朝知らせ直す。issue-breakdown が issue を作り終えたときの呼び出し(label を渡さない)は、
  # 開いている needs-decision の issue だけをまとめる
  digest:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.number == '')
    runs-on: ubuntu-latest
    steps:
      - name: Slack に送る
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS: ${{ (github.event_name == 'schedule' || inputs.label == 'all') && 'needs-human needs-decision needs-approval' || 'needs-decision' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::secret SLACK_WEBHOOK_URL が無いので Slack に送らなかった"
            exit 0
          fi

          cat > item.jq <<'JQ'
          def clean: gsub("\r"; "") | gsub("<!--[\\s\\S]*?-->"; "") | gsub("^\\s+|\\s+$"; "");
          def first_line: split("\n") | map(gsub("^[\\s>*#-]+|\\s+$"; "")) | map(select(. != "")) | (first // "")
            | if length > 120 then .[0:120] + "…" else . end;
          # 見出しは、手で書いた本文なら ##、issue forms(.github/ISSUE_TEMPLATE)から作った本文なら ###。
          # issue forms は空欄に _No response_ と書くので、それは無いものとして扱う
          def section: ((gsub("\r"; "") | capture("(^|\n)#{2,3} 判断が要ること[^\n]*\n(?<s>[\\s\\S]*?)(\n#{2,3} |$)") | .s) // "")
            | if test("^\\s*_No response_\\s*$") then "" else . end;

          # 何を頼んでいるかは、頼むコメント(目印 <!-- ai-dev:<ラベル> -->)の最初の 1 行で示す。目印が無ければ、
          # needs-decision は本文の「判断が要ること」を使う。public のリポジトリでは誰でもコメントできるので、
          # 目印を信じるのは、書き込み権限のある人と GitHub App のコメントだけ
          # --slurpfile で受けるので、ファイルの中身は 1 要素の配列に入っている
          $target[0] as $target | $comments[0] as $comments | $events[0] as $events
          | ["OWNER", "MEMBER", "COLLABORATOR"] as $trusted
          | ($comments | map(select((.author_association as $a | $trusted | index($a)) or .user.type == "Bot"))
             | map(select(.body | contains("ai-dev:\($label)"))) | last) as $marked
          | (if $marked then {text: ($marked.body | clean | first_line), url: $marked.html_url}
             elif $label == "needs-decision" then {text: ($target.body | section | clean | first_line), url: $target.url}
             else {text: "", url: $target.url} end) as $ask
          | ($events | map(select(.event == "labeled" and .label.name == $label)) | last | .created_at) as $since
          | $target + {label: $label, ask: $ask,
              days: (if $since then (($now - ($since | fromdate)) / 86400 | floor) else null end)}
          JQ

          # コメントやイベントは長い PR だと引数の長さの上限を超えるので、jq にはファイルで渡す
          now=$(date -u +%s)
          : > items.jsonl
          for label in $LABELS; do
            # issue の API は PR も返す(PR なら pull_request が付く)。作っている途中の issue(ai-dev:pending-body)は入れない
            gh api --paginate "repos/$REPO/issues?state=open&labels=$label&per_page=100" \
              --jq '.[] | select((.body // "") | contains("ai-dev:pending-body") | not)
                | {number, title, url: .html_url, body: (.body // ""), kind: (if .pull_request then "PR" else "issue" end)}' \
              > targets.jsonl
            while read -r target; do
              printf '%s\n' "$target" > target.json
              n=$(jq -r .number target.json)
              gh api --paginate --slurp "repos/$REPO/issues/$n/comments?per_page=100" | jq 'add // []' > comments.json
              gh api --paginate --slurp "repos/$REPO/issues/$n/events?per_page=100" | jq 'add // []' > events.json
              jq -c -n -f item.jq --arg label "$label" --argjson now "$now" \
                --slurpfile target target.json --slurpfile comments comments.json --slurpfile events events.json \
                >> items.jsonl
            done < targets.jsonl
          done

          if [ ! -s items.jsonl ]; then
            echo "人の番になっているもの($LABELS)が無いので送らなかった"
            exit 0
          fi

          cat > digest.jq <<'JQ'
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def link($url; $label): "<\($url)|\($label | esc)>";
          def waited: if .days == null then "" elif .days == 0 then "(今日から)" else "(\(.days) 日前から)" end;

          {
            "needs-human":    {head: ":raising_hand: *人の判断が必要*(needs-human)", act: "頼むコメントに返信する"},
            "needs-decision": {head: ":thinking_face: *着手する前に決めてほしい*(needs-decision)", act: "issue にコメントで答えると、続きが進む"},
            "needs-approval": {head: ":white_check_mark: *承認を待っている*(needs-approval)", act: "問題が無ければマージすると承認になる。直してほしいことは PR にコメントする"}
          } as $t
          | ($items | map(.url) | unique | length) as $count
          | {
              unfurl_links: false,
              text: ([
                (if $labels == "needs-decision"
                  then ":thinking_face: *着手する前に決めてほしいことが \($count) 件あります*(\($repo))"
                  else ":bell: *人の返事を待っているものが \($count) 件あります*(\($repo))" end),
                ($labels | split(" ")[] as $label
                  | ($items | map(select(.label == $label)) | sort_by(-(.days // 0), .number)) as $list
                  | select($list | length > 0)
                  | "", $t[$label].head, $t[$label].act,
                    ($list[] | "• \(link(.url; "\(.kind) #\(.number) \(.title)"))\(waited)"
                      + (if .ask.text != "" then "\n      \(link(.ask.url; .ask.text))" else "" end)))
              ] | join("\n"))
            }
          JQ

          jq -n -f digest.jq --arg repo "$REPO" --arg labels "$LABELS" --slurpfile items items.jsonl \
            | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
