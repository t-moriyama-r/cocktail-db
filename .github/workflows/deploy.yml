name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mixhost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: cocktail-db
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install backend (with dev, for the OpenAPI check)
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      # BE の変更で API の形が変わったのに openapi.json を更新し忘れていたら止める(FE の型がずれるため)
      - name: Check OpenAPI is up to date
        working-directory: backend
        run: |
          php artisan scramble:export --path=../openapi/openapi.json
          git diff --exit-code -- ../openapi/openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Reinstall backend without dev dependencies
        working-directory: backend
        run: |
          rm .env
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIXHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.MIXHOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # .env と storage(ログ・セッション)はサーバー側のものを残す
      - name: Upload with rsync
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/.well-known/' \
            --exclude 'tests/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            backend/ "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}:~/${APP_DIR}/"

      - name: Prepare storage and cache config
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" "
            set -e
            cd ~/${APP_DIR}
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            php artisan optimize
          "

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.APP_URL }}/up" > /dev/null
          curl -fsS "${{ vars.APP_URL }}/api/hello"
