name: deploy

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mixhost
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # 手動実行でも release 以外のブランチからはデプロイしない
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    env:
      APP_DIR: cocktail-db
    steps:
      - uses: actions/checkout@v7
        with:
          # 依存ライブラリのインストールで動くコードに、リポジトリのトークンを渡さない
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend without dev dependencies
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIXHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.MIXHOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # .env と storage(ログ・セッション・アップロードした画像)はサーバー側のものを残す。
      # public/storage は storage:link が作るリンクで、手元のビルドには無いので、--delete で消させない
      - name: Upload with rsync
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/storage' \
            --exclude 'public/.well-known/' \
            --exclude 'tests/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            backend/ "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}:~/${APP_DIR}/"

      - name: Prepare storage and cache config
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${{ secrets.MIXHOST_SSH_USER }}@${{ secrets.MIXHOST_SSH_HOST }}" "
            set -e
            cd ~/${APP_DIR}
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            # 画像を /storage/<ファイル名> で配信するためのリンク(public/storage → storage/app/public)。
            # 既にあれば作らずに 0 で終わる
            php artisan storage:link
            php artisan optimize
          "

      - name: Smoke test
        run: |
          curl -fsS "${{ vars.APP_URL }}/up" > /dev/null
          curl -fsS "${{ vars.APP_URL }}/api/hello"
