name: ops-archive-storage

# 画像の退避スクリプト(ops/backup/archive-storage.sh)のテスト。
# 必須のチェックにするので、paths で絞らずにすべての PR で動かす
# (絞ると、関係の無い PR でチェックが来ずに止まる)。

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  archive-storage:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck ops/backup/archive-storage.sh ops/backup/tests/archive-storage.test.sh

      - name: Test archive-storage.sh
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: ops/backup/tests/archive-storage.test.sh
