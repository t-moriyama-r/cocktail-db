name: evidence-gate

# FE・BE のコードを変えた PR の本文の「## 証跡」に、修正前後の静止画と動画がそろっているかを確かめる。決め方は .github/scripts/evidence-gate.sh
# 証跡は ready にする前に貼る決まり(CLAUDE.md の「ブランチ・コミット・PR」の 5・6)なので、draft では流さず、ready にしたときと、
# その後に本文を直した・push したときに流す。赤のあいだは ai-auto-merge.yml がマージしない(チェックがすべて成功していることを見るため)
on:
  pull_request:
    branches: [develop]
    # 証跡は本文に貼るので、本文を直したときにも確かめ直す
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: evidence-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the evidence section
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/evidence-gate.sh "$REPO" "$NUMBER"
