# ワークフロー(.github/workflows/)を変えた PR がマージされたら、Slack に知らせる
#
# ワークフローを変えた PR も、エージェントが作り ai-auto-merge.yml が自動でマージしうるので、書き換わったものがマージされたことを
# 人(オーナー)が必ず知れるようにする(Actions の Claude Code は App のトークンではワークフローのファイルを push できない(#241)が、
# 手元のエージェントが作った PR や、needs-local で手元が当てた差分は、そのまま流れに乗る)。
# 変わったファイルの名前だけでは、見なくてよい変更かどうかが分からないので、どういう変更かのサマリー
# (.github/scripts/workflow-change-summary.sh。要注意の変更があるかと、権限・secret・トリガーなどに触れる行)を付ける
#
# きっかけは 2 つあり、1 件につきどちらか一方だけが 1 通送る
# - pull_request_target(closed): 人か、ai-auto-merge.yml が secret AUTO_MERGE_TOKEN(オーナーの PAT)でマージしたとき(#540)
# - workflow_dispatch: ai-auto-merge.yml が GITHUB_TOKEN でマージしたとき(GITHUB_TOKEN のマージはイベントを起こさないので、直接呼ばれる)
#
# 送り先は notify-needs-human.yml と同じ(.github/scripts/slack-post.sh。bot か Webhook。どちらも無ければ何もせず警告だけ出す)
name: ワークフローの変更のマージを Slack に知らせる

on:
  # checkout するのは、動いているワークフローと同じ版(既定のブランチ)のスクリプトだけなので、
  # pull_request_target でも PR(フォーク)のコードは動かない
  pull_request_target:
    types: [closed]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      number:
        description: マージした PR の番号
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # サマリーを作るスクリプトと送信用のスクリプト。PR のコードではなく、動いているワークフローと同じ版を使う
      - uses: actions/checkout@v6
        with:
          path: .ai-dev
          # pull_request_target は既定では PR の向き先のブランチを取るので、staging・release 向けでもスクリプトのある既定のブランチを取る(ほかのイベントは github.ref が既定のブランチか、手で動かしたブランチ)
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Slack に送る
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NOTIFY_USER: ${{ vars.SLACK_NOTIFY_USER }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number || github.event.pull_request.number }}
        run: |
          pr=$(gh pr view "$NUMBER" -R "$REPO" --json title,url,mergedBy,baseRefName)
          # gh pr view の files は 100 件で切れるので、ファイルの差分は API からすべて取る。
          # API の一時的な失敗などでサマリーが作れなくても、書き換わったワークフローを人が見るきっかけは残したいので、
          # 結論の行だけにして PR のリンクは送る。
          # パイプでつなぐと(pipefail が無いので)gh api の失敗が見えず、空のサマリーで「変えていない」扱いになるので、先に取る
          if ! files=$(gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/files?per_page=100"); then
            echo "::warning::#$NUMBER の変わったファイルを読めなかった"
            summary=':warning: 変わったファイルを読めず、サマリーを作れなかった。差分を見てください'
          elif ! summary=$(set -o pipefail; jq 'add // []' <<<"$files" | bash .ai-dev/.github/scripts/workflow-change-summary.sh); then
            echo "::warning::#$NUMBER のサマリーを作れなかった"
            summary=':warning: サマリーを作れなかった。差分を見てください'
          elif [ -z "$summary" ]; then
            echo "#$NUMBER はワークフローを変えていないので送らなかった"
            exit 0
          fi
          echo "$summary"

          # サマリーの 1 行目は結論、2 行目からはファイルごとの中身(どちらも mrkdwn のエスケープ済み)
          jq -n --arg repo "$REPO" --argjson pr "$pr" --arg summary "$summary" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            ($summary | split("\n")) as $lines
            | {
              unfurl_links: false,
              text: ([
                ":warning: *ワークフローを変えた PR がマージされた*(\($repo))",
                "",
                "*PR*: <\($pr.url)|\($pr.title | esc)>(\($pr.baseRefName) へ。マージした人: \($pr.mergedBy.login // "不明"))",
                $lines[0],
                "",
                "*変わったワークフロー*(<\($pr.url)/files|差分>):",
                $lines[1:][]
              ] | join("\n"))
            }' | .ai-dev/.github/scripts/slack-post.sh
