# ワークフロー(.github/workflows/)を変えた PR がマージされたら、Slack に知らせる
#
# Actions の Claude Code は App のトークンでワークフローを書き換えられるので、書き換わったものがマージされたことを
# 人(オーナー)が必ず知れるようにする。
#
# きっかけは 2 つあり、1 件につきどちらか一方だけが 1 通送る
# - pull_request_target(closed): 人がマージしたとき
# - workflow_dispatch: ai-auto-merge.yml が GITHUB_TOKEN でマージしたとき(GITHUB_TOKEN のマージはイベントを起こさないので、直接呼ばれる)
#
# 送り先は secret の SLACK_WEBHOOK_URL(Slack の Incoming Webhook)。無ければ何もせず警告だけ出す
name: ワークフローの変更のマージを Slack に知らせる

on:
  # コードを checkout しないので、pull_request_target でもフォークのコードは動かない
  pull_request_target:
    types: [closed]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      number:
        description: マージした PR の番号
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Slack に送る
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number || github.event.pull_request.number }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::secret SLACK_WEBHOOK_URL が無いので Slack に送らなかった"
            exit 0
          fi

          pr=$(gh pr view "$NUMBER" -R "$REPO" --json title,url,mergedBy,baseRefName,files)
          files=$(jq '[.files[].path | select(startswith(".github/workflows/"))]' <<<"$pr")
          if [ "$(jq length <<<"$files")" = 0 ]; then
            echo "#$NUMBER はワークフローを変えていないので送らなかった"
            exit 0
          fi

          jq -n --arg repo "$REPO" --argjson pr "$pr" --argjson files "$files" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            {
              unfurl_links: false,
              text: ([
                ":warning: *ワークフローを変えた PR がマージされた*(\($repo))",
                "",
                "*PR*: <\($pr.url)|\($pr.title | esc)>(\($pr.baseRefName) へ。マージした人: \($pr.mergedBy.login // "不明"))",
                "*変わったワークフロー*:",
                ($files[] | "• `\(. | esc)`"),
                "",
                "意図しない変更(権限・secret・外部への送信など)が入っていないか、差分を確かめてください"
              ] | join("\n"))
            }' | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
