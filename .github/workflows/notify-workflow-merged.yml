# ワークフロー(.github/workflows/)を変えた PR がマージされたら、Slack に知らせる
#
# Actions の Claude Code は App のトークンでワークフローを書き換えられるので、書き換わったものがマージされたことを
# 人(オーナー)が必ず知れるようにする。
# 変わったファイルの名前だけでは、見なくてよい変更かどうかが分からないので、どういう変更かのサマリー
# (.github/scripts/workflow-change-summary.sh。要注意の変更があるかと、権限・secret・トリガーなどに触れる行)を付ける
#
# きっかけは 2 つあり、1 件につきどちらか一方だけが 1 通送る
# - pull_request_target(closed): 人がマージしたとき
# - workflow_dispatch: ai-auto-merge.yml が GITHUB_TOKEN でマージしたとき(GITHUB_TOKEN のマージはイベントを起こさないので、直接呼ばれる)
#
# 送り先は secret の SLACK_WEBHOOK_URL(Slack の Incoming Webhook)。無ければ何もせず警告だけ出す
name: ワークフローの変更のマージを Slack に知らせる

on:
  # checkout するのは、動いているワークフローと同じ版(マージ先のブランチ)のスクリプトだけなので、
  # pull_request_target でも PR(フォーク)のコードは動かない
  pull_request_target:
    types: [closed]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      number:
        description: マージした PR の番号
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # サマリーを作るスクリプト。PR のコードではなく、動いているワークフローと同じ版を使う
      - uses: actions/checkout@v6
        with:
          path: .ai-dev
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Slack に送る
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number || github.event.pull_request.number }}
        run: |
          pr=$(gh pr view "$NUMBER" -R "$REPO" --json title,url,mergedBy,baseRefName)
          # gh pr view の files は 100 件で切れるので、ファイルの差分は API からすべて取る
          summary=$(gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/files?per_page=100" | jq 'add // []' \
            | bash .ai-dev/.github/scripts/workflow-change-summary.sh)
          if [ -z "$summary" ]; then
            echo "#$NUMBER はワークフローを変えていないので送らなかった"
            exit 0
          fi
          echo "$summary"

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::secret SLACK_WEBHOOK_URL が無いので Slack に送らなかった"
            exit 0
          fi

          # サマリーの 1 行目は結論、2 行目からはファイルごとの中身(どちらも mrkdwn のエスケープ済み)
          jq -n --arg repo "$REPO" --argjson pr "$pr" --arg summary "$summary" '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            ($summary | split("\n")) as $lines
            | {
              unfurl_links: false,
              text: ([
                ":warning: *ワークフローを変えた PR がマージされた*(\($repo))",
                "",
                "*PR*: <\($pr.url)|\($pr.title | esc)>(\($pr.baseRefName) へ。マージした人: \($pr.mergedBy.login // "不明"))",
                $lines[0],
                "",
                "*変わったワークフロー*(<\($pr.url)/files|差分>):",
                $lines[1:][]
              ] | join("\n"))
            }' | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
